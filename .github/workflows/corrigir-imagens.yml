name: Corrigir imagens do Lovable

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Baixar imagens e corrigir os imports
        run: |
          python3 - <<'PYEOF'
          import json, re, sys, pathlib, urllib.request

          BASE   = "https://probel-dreamweaver-pro.lovable.app"
          ROOT   = pathlib.Path(".")
          ASSETS = ROOT / "src" / "assets"

          # ---- 1) baixa a imagem real de cada ponteiro .asset.json ----
          pointers = sorted(ASSETS.glob("*.asset.json"))
          print(f"Ponteiros encontrados: {len(pointers)}")
          if not pointers:
              print("Nada a fazer — nenhum ponteiro .asset.json no repositorio.")
              sys.exit(0)

          falhas = []
          for p in pointers:
              meta    = json.loads(p.read_text())
              destino = ASSETS / meta["original_filename"]
              url     = BASE + meta["url"]
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read()
                  if len(data) < 100:
                      raise ValueError(f"resposta muito pequena ({len(data)} bytes)")
                  destino.write_bytes(data)
                  print(f"  OK      {destino.name}  ({len(data):,} bytes)")
              except Exception as e:
                  print(f"  FALHOU  {destino.name}: {e}")
                  falhas.append(destino.name)

          # se algum download falhar, nao mexe em nenhuma linha de codigo
          if falhas:
              print(f"\nERRO: {len(falhas)} download(s) falharam. Codigo nao foi alterado.")
              sys.exit(1)

          # ---- 2) corrige os imports e os usos de .url ----
          # so troca .url dos identificadores que vieram de um .asset.json,
          # para nao quebrar coisas como error.url em lovable-error-reporting.ts
          IMPORT_RE = re.compile(r'import\s+(\w+)\s+from\s+(["\'])([^"\']*?)\.asset\.json\2\s*;?')
          ajustados = 0
          for f in ROOT.glob("src/**/*"):
              if f.suffix not in (".ts", ".tsx") or "assets" in f.parts:
                  continue
              texto = original = f.read_text()
              idents = [m.group(1) for m in IMPORT_RE.finditer(texto)]
              if not idents:
                  continue
              texto = IMPORT_RE.sub(
                  lambda m: f'import {m.group(1)} from {m.group(2)}{m.group(3)}{m.group(2)};', texto)
              for ident in idents:
                  texto = re.sub(rf'\b{re.escape(ident)}\.url\b', ident, texto)
              if texto != original:
                  f.write_text(texto)
                  ajustados += 1
                  print(f"  ajustado {f}  ({len(idents)} imports)")

          # ---- 3) remove os ponteiros ----
          for p in pointers:
              p.unlink()

          print(f"\nConcluido: {len(pointers)} imagens baixadas, {ajustados} arquivos de codigo ajustados.")
          PYEOF

      - name: Commitar as mudancas
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nada mudou."
          else
            git commit -m "fix: substitui ponteiros do Lovable por imagens reais no repositorio"
            git push
          fi
